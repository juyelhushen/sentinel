global:
  scrape_interval: 15s

scrape_configs:
  - job_name: sentinel
    scheme: https
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - sentinel-api-6jrt.onrender.com
    http_headers:
      X-API-Key:
        files:
          - /run/secrets/sentinel_api_key.txt