[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous Multi-Agent Engineering Ops Copilot"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.0",
    "langgraph>=1.2.11",
    "mcp>=2.2.0",
    "ollama>=0.6.2",
    "psycopg-pool>=3.3,<4",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external infrastructure",
]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src"]
explicit_package_bases = true
