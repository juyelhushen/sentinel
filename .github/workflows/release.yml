name: Sentinel Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: sentinel-release-deployment
  cancel-in-progress: false

jobs:
  quality-and-deploy:
    name: Quality Checks and Render Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check src tests scripts/release_guard.py

      - name: Lint
        run: uv run ruff check src tests scripts/release_guard.py

      - name: Type check
        run: uv run mypy src scripts/release_guard.py

      - name: Run tests
        run: uv run pytest -q -m "not integration"

      - name: Validate release tag and version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          set -euo pipefail

          uv run python scripts/release_guard.py validate-ancestry
          uv run python scripts/release_guard.py validate
          uv run pytest -q tests/unit/test_api.py::test_project_and_api_versions_match_package_version

      - name: Validate Render deployment configuration
        id: render_preflight
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || secrets.RENDER_SERVICE_ID }}
        run: uv run python scripts/release_guard.py preflight

      - name: Trigger and verify Render deployment
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GITHUB_SHA: ${{ github.sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID || secrets.RENDER_SERVICE_ID }}
          RENDER_BASELINE_DEPLOY_IDS: ${{ steps.render_preflight.outputs.baseline_deploy_ids }}
        run: uv run python scripts/release_guard.py deploy
